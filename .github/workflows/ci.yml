name: BTP Simulator CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main repo and recursively initialize submodules
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Apply custom runtime patch to coral-mpact submodule
      - name: Apply Coral-MPACT Custom Runtime Patch
        run: |
          echo "Applying local patch to submodule..."
          cd third_party/coral-mpact
          git apply ../../coral-runtime.patch
          git status

      # 3. Install xPack RISC-V GCC Toolchain
      - name: Setup xPack RISC-V GCC Toolchain
        run: |
          echo "Downloading xPack RISC-V GCC..."
          wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          tar -xzf xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          
          # Add bin directory to GitHub Actions PATH for subsequent steps
          echo "$PWD/xpack-riscv-none-elf-gcc-13.2.0/bin" >> $GITHUB_PATH
          
          # Verify installation using absolute path in this current step
          $PWD/xpack-riscv-none-elf-gcc-13.2.0/bin/riscv-none-elf-gcc --version

      # 4. Build the custom runtime target with Bazel
      - name: Build Simulator Runtime
        run: |
          cd third_party/coral-mpact
          bazel build //sim:coral_runtime

      # 5. Build Firmware and Run Simulation Test
      - name: Run Simulation Test
        run: |
          cd runtime
          # Compile firmware using xPack toolchain
          riscv-none-elf-gcc -march=rv32imf -mabi=ilp32 -O2 -T linker.ld start.s target_main.c -o firmware.elf -nostdlib
          
          # Execute Python runner driver
          python3 run_sim.py firmware.elf --timeout 2.0 --out result.bin --log-out simulation.log
          cat simulation.log
